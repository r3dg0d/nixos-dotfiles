# mpv — oscc theme (github.com/0dist/oscc)
# The oscc.lua script in scripts/ replaces mpv's built-in OSC, so disable it:
osc=no
osd-bar=no
cursor-autohide=3500          # keep in sync with oscc's hidetimeout

# OSD text font (oscc uses this for title/time; button icons use the oscc font)
osd-font="JetBrainsMono Nerd Font"
